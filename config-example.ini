# Run from the repository root. Relative paths use the current directory.
# Copy this file to config.ini and adapt paths and filenames to your data.

[paths]
data_dir = ./data
# Optional: omit sct_dir if sCTs are stored in data_dir.
sct_dir = ./data
splits_dir = ./splits
output_dir = ./results/experiment_01

[images]
# Exact filenames inside each patient folder.
mri_filename = mr.nii.gz
ct_filename = ct.nii.gz
mask_filename = mask.nii.gz
# One or multiple sCTs per patient. Adapt the pattern to your filenames.
# Use sCT.nii.gz for a single named file, or sCT*.nii.gz for all matches.
sct_glob = sCT*.nii.gz
# Add each patient's reference CT as an ideal sCT in all three phases.
include_ideal_sct = false

[hardware]
# Execution device: auto, cpu, or cuda:N (for example cuda:0).
device = auto

[model]
backbone = efficientnet-b4
pretrained = true
dropout = 0.3
height = 256
width = 256

[training]
learning_rate = 0.00005
weight_decay = 0.0001
l1_lambda = 0.0001
batch_size = 20
max_epochs = 100
num_workers = 0
seed = 42

[scheduler]
factor = 0.5
patience = 5

[early_stopping]
patience = 10

[inference]
batch_size = 16
